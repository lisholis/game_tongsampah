<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengenalan Sampah Organik dan Anorganik</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        /* Background Gambar Full */
        .bg-container {
            background-image: url('images/halut.png'); 
            background-size: cover;
            background-position: center;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .menu-box {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .header-image {
            width: 100%;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .menu-title {
            margin-bottom: 20px;
            color: #2d5a27;
            font-size: 1.6rem;
            font-weight: bold;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px; /* Memberi ruang untuk sub-title */
        }

        .menu-item {
            text-decoration: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .menu-item:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .organik { background-color: #4CAF50; }
        .anorganik { background-color: #2196F3; }
        .permainan { background-color: #FF9800; }

        /* Styling Sub-Title Baru */
        .sub-title {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
            font-style: italic;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        @media (max-width: 480px) {
            .menu-box { padding: 20px; }
            .menu-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="menu-box">
            <img src="https://cdn-icons-png.flaticon.com/512/3299/3299935.png" alt="Icon" class="header-image">
            
            <div class="menu-title">Pengenalan Sampah Organik dan Anorganik</div>

            <nav class="menu-list">
                <a href="sampah_organik.html" class="menu-item organik">Sampah Organik</a>
                <a href="sampah_anorganik.html" class="menu-item anorganik">Sampah Anorganik</a>
                <a href="game_sampah.html" class="menu-item permainan">Permainan Pilah Sampah</a>
            </nav>

            <div class="sub-title">
               Dibuat Oleh FST UIBU
            </div>
        </div>
    </div>

</body>
</html>
